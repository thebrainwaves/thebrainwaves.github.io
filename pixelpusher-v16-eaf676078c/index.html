<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#06070c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-title" content="Pixel Pusher">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="On-device visual studio by Brainhertz Productions. Original GPU effects, drawing and frame capture. No uploads.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./studio.css">
<title>Pixel Pusher — Brainhertz Productions</title>
<script type="module" src="./js/v16/studio.js"></script>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" class="symbols" aria-hidden="true">

<symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="m14 7 3 3"/></symbol>
<symbol id="i-neon" viewBox="0 0 24 24"><path d="M4 18c3-8 6 0 9-6s4-6 7-6"/><path d="M4 21c3-8 6 0 9-6s4-6 7-6" opacity=".35"/></symbol>
<symbol id="i-marker" viewBox="0 0 24 24"><path d="m14 4 6 6-8 8H6v-6z"/><path d="M4 21h9"/></symbol>
<symbol id="i-spray" viewBox="0 0 24 24"><rect x="8" y="9" width="8" height="12" rx="2"/><path d="M10 9V6h4v3"/><circle cx="19" cy="4" r=".6"/><circle cx="21" cy="7" r=".6"/><circle cx="18" cy="7" r=".6"/></symbol>
<symbol id="i-eraser" viewBox="0 0 24 24"><path d="m3 15 9-9 7 7-6 6H7z"/><path d="M8 10l7 7M10 21h11"/></symbol>
<symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.2"/><circle cx="15" cy="17" r="2.2"/></symbol>
<symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h4l10 10h4M3 17h4l3-3m4-4 3-3h4"/><path d="m18 4 3 3-3 3m0 4 3 3-3 3"/></symbol>
<symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
<symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="m16 9 5 6m0-6-5 6"/></symbol>
<symbol id="i-clip" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></symbol>
<symbol id="i-tap" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-freeze" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
<symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 12c2.5-7 5-7 7.5 0s5 7 7.5 0 3.5-5 5-3"/></symbol>
<symbol id="i-lfo" viewBox="0 0 24 24"><path d="M2 14c2-8 4.5-8 6.5 0s4.5 8 6.5 0 4-8 7-4"/><circle cx="8.5" cy="14" r="2.2"/><path d="M2 21h20"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9.5" r="2"/><path d="m3 17 5-5 4 4 3-3 6 6"/></symbol>
<symbol id="i-flip" viewBox="0 0 24 24"><path d="M4 9a8 8 0 0 1 14-3l2 2M20 15a8 8 0 0 1-14 3l-2-2"/><path d="M20 3v5h-5M4 21v-5h5"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-record" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4" class="fill"/></symbol>
<symbol id="i-finger" viewBox="0 0 24 24"><path d="M9 11V5a1.6 1.6 0 0 1 3.2 0v5"/><path d="M12.2 10V8.6a1.6 1.6 0 0 1 3.2 0V11"/><path d="M15.4 10.4a1.6 1.6 0 0 1 3.2 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.8-2.4L4 15.4a1.6 1.6 0 0 1 2.5-2L9 15"/><path d="M3 5.5a6 6 0 0 1 3-3" opacity=".6"/></symbol>
<symbol id="i-fxbrush" viewBox="0 0 24 24"><path d="M14 4l6 6-8.5 8.5-6-6z"/><path d="M5.5 12.5 3 21l8.5-2.5"/><path d="M17 2.5l.5 1.5M21.5 7l-1.5-.5M20 3.5l-1 1" /></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" class="fill"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1" class="fill"/><rect x="14" y="4.5" width="4" height="15" rx="1" class="fill"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="5.5" y="5.5" width="13" height="13" rx="2" class="fill"/></symbol>
<symbol id="i-loop" viewBox="0 0 24 24"><path d="M4 11V9a3 3 0 0 1 3-3h12l-3-3m3 3-3 3"/><path d="M20 13v2a3 3 0 0 1-3 3H5l3 3m-3-3 3-3"/></symbol>
<symbol id="i-clips" viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="12" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v10"/><path d="m9 10 5 3-5 3z" class="fill"/></symbol>
<symbol id="i-key" viewBox="0 0 24 24"><path d="m12 3 9 9-9 9-9-9z"/></symbol>
<symbol id="i-beat" viewBox="0 0 24 24"><path d="M3 12h3l2-6 3 12 3-9 2 3h5"/></symbol>
<symbol id="i-mixer" viewBox="0 0 24 24"><path d="M6 3v18M12 3v18M18 3v18"/><rect x="3.5" y="13" width="5" height="3" rx="1"/><rect x="9.5" y="6" width="5" height="3" rx="1"/><rect x="15.5" y="10" width="5" height="3" rx="1"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
<symbol id="i-projector" viewBox="0 0 24 24"><rect x="2" y="8" width="14" height="9" rx="2"/><circle cx="9" cy="12.5" r="2.6"/><path d="m16 10 6-3v11l-6-3"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="m5 14 7-7 7 7"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="m5 10 7 7 7-7"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 4 9 5-9 5-9-5z"/><path d="m3 14 9 5 9-5"/></symbol>
</svg>
<div id="app" class="app" data-tab="effects">
 <header class="topbar panel">
  <h1 class="brand" aria-label="Pixel Pusher version 1.8.3"><span class="wordmark"><span class="wm-a">PIXEL</span>&nbsp;<span class="wm-b">PUSHER</span></span><small><span class="maker">BRAINHERTZ</span><span id="version">1.8.3</span></small></h1>
  <div class="tb-group">
   <button id="btn-undo" class="tb-btn icon" type="button" aria-label="Undo" disabled><svg><use href="#i-undo"/></svg></button>
   <button id="btn-redo" class="tb-btn icon" type="button" aria-label="Redo" disabled><svg><use href="#i-redo"/></svg></button>
   <button id="btn-save" class="tb-btn accent" type="button" aria-label="Save or export"><svg><use href="#i-save"/></svg><span>Save</span></button>
  </div>
 </header>
 <main id="stage" class="stage panel">
  <div id="frame" class="canvas-frame"><canvas id="output" aria-label="Live preview. Hold to compare with the original, drag to adjust the selected effect."></canvas></div>
  <div id="touch-overlay" class="touch-overlay" aria-hidden="true"></div>
  <div id="map-view" class="map-view"><canvas id="map-canvas" aria-label="Projection map output"></canvas><canvas id="map-ui" class="map-ui" aria-label="Map editor: drag corner pins, mesh points or mask points"></canvas></div>
  <div id="mode-pill" class="mode-pill" hidden></div>
  <button id="gen-edit" class="gen-edit" type="button" aria-label="Edit text on preview" hidden><svg><use href="#i-pen"/></svg><span>Edit text</span></button>
  <div id="hud" class="hud" hidden></div>
  <button id="onair" class="onair-badge" type="button" hidden aria-label="Input on air: tap to stop">ON AIR</button>
  <button id="link-badge" class="link-badge" type="button" hidden aria-label="Wi-Fi link active: open Link">LINK</button>
  <button id="rec-badge" class="rec-badge" type="button" hidden aria-label="Stop recording">REC 0:00</button>
 </main>
 <section id="timeline" class="timeline panel" aria-label="Timeline">
  <div class="tl-head">
   <button id="vt-play" class="vt-btn play" type="button" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
   <button id="vt-stop" class="vt-btn" type="button" aria-label="Reset to start"><svg><use href="#i-reset"/></svg></button>
   <div class="tc-box"><output id="vt-time" class="tc">00:00:00</output><small id="vt-sub" class="tc-sub">/ 00:08:00</small></div>
   <button id="vt-loop" class="vt-btn small" type="button" aria-label="Loop" aria-pressed="true"><svg><use href="#i-loop"/></svg></button>
   <button id="tl-key" class="vt-btn small key" type="button" aria-label="Keyframes"><span class="dia" aria-hidden="true"></span></button>
   <button id="tl-more" class="vt-btn small" type="button" aria-label="Timeline settings"><svg><use href="#i-sliders"/></svg></button>
   <input id="vt-scrub" class="sr-only" type="range" min="0" max="1000" step="1" value="0" aria-label="Timeline position">
  </div>
  <canvas id="tl-canvas" class="tl-canvas" aria-label="Timeline tracks: waveform, kick, hits and keyframes. Drag to scrub."></canvas>
 </section>
 <nav class="tabs panel" role="tablist" aria-label="Studio sections">
  <button role="tab" class="tab" data-tab="source" aria-selected="false" type="button"><svg><use href="#i-source"/></svg><span>Source</span></button>
  <button role="tab" class="tab" data-tab="effects" aria-selected="true" type="button"><svg><use href="#i-sliders"/></svg><span>Effects</span></button>
  <button role="tab" class="tab" data-tab="perform" aria-selected="false" type="button"><svg><use href="#i-finger"/></svg><span>Perform</span></button>
  <button role="tab" class="tab" data-tab="draw" aria-selected="false" type="button"><svg><use href="#i-pen"/></svg><span>Draw</span></button>
  <button role="tab" class="tab" data-tab="frames" aria-selected="false" type="button"><svg><use href="#i-film"/></svg><span>Frames</span></button>
  <button role="tab" class="tab" data-tab="looks" aria-selected="false" type="button"><svg><use href="#i-layers"/></svg><span>Looks</span></button>
  <button role="tab" class="tab" data-tab="motion" aria-selected="false" type="button"><svg><use href="#i-wave"/></svg><span>Motion</span></button>
  <button role="tab" class="tab" data-tab="audio" aria-selected="false" type="button"><svg><use href="#i-mixer"/></svg><span>Audio</span></button>
  <button role="tab" class="tab" data-tab="map" aria-selected="false" type="button"><svg><use href="#i-projector"/></svg><span>Map</span></button>
 </nav>
 <section class="strip-wrap panel"><div id="strip" class="strip" role="listbox" aria-label="Tools"></div></section>
 <section id="drawer" class="drawer panel" hidden aria-live="polite"></section>
 <div id="inspector-ph" class="inspector-ph panel"><b>INSPECTOR</b><span>Tap an effect, source or tool to edit it here.</span></div>
</div>
<div id="review" class="review" hidden role="dialog" aria-modal="true" aria-labelledby="rv-title">
 <header class="rv-head"><button id="rv-back" class="tb-btn" type="button"><svg><use href="#i-left"/></svg><span>Back to edit</span></button><div class="rv-title"><b id="rv-title">REVIEW</b><small id="rv-sub">LOOPING IN → OUT</small></div><output id="rv-tc" class="tc">00:00:00</output></header>
 <div class="rv-stage"><canvas id="rv-view" aria-label="Full-size looped review"></canvas><video id="rv-video" playsinline muted hidden></video><div id="rv-progress" class="rv-progress" hidden><span id="rv-ptext">RENDERING</span><i><b id="rv-pbar"></b></i></div></div>
 <div class="rv-trim"><canvas id="rv-trim" aria-label="Trim: drag the IN and OUT handles"></canvas><div class="rv-read"><span>IN <b id="rv-in">00:00:00</b></span><span>OUT <b id="rv-out">00:00:00</b></span><span>LEN <b id="rv-len">0.00 s</b></span></div></div>
 <div class="rv-actions"><button id="rv-photos" class="tb-btn accent" type="button"><svg><use href="#i-save"/></svg><span>Save to Photos</span></button><button id="rv-share" class="tb-btn blue" type="button"><svg><use href="#i-share"/></svg><span>Share</span></button></div>
 <div class="rv-more"><button id="rv-clip" class="tb-btn" type="button"><svg><use href="#i-film"/></svg><span>Make clip</span></button><button id="rv-use" class="tb-btn" type="button" hidden><svg><use href="#i-image"/></svg><span>Use as source</span></button><button id="rv-png" class="tb-btn" type="button"><svg><use href="#i-frame"/></svg><span>PNG frame</span></button><button id="rv-frames" class="tb-btn" type="button"><svg><use href="#i-plus"/></svg><span>Add to frames</span></button><button id="rv-record" class="tb-btn" type="button"><svg><use href="#i-record"/></svg><span>Record live</span></button></div>
</div>
<div id="sheet" class="sheet-backdrop" hidden><section class="sheet panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><header class="sheet-head"><h2 id="sheet-title">Sheet</h2><button id="sheet-close" class="tb-btn icon" type="button" aria-label="Close"><svg><use href="#i-close"/></svg></button></header><div id="sheet-body" class="sheet-body"></div></section></div>
<div id="toast" class="toast" role="status" hidden></div>
<video id="media" playsinline muted loop hidden></video>
<input id="file" type="file" accept="image/*,video/*" hidden aria-label="Choose a photo or video">
<input id="venue-file" type="file" accept="application/json,.json" hidden aria-label="Import a venue JSON file">
<div id="map-out" class="map-out" hidden aria-label="Clean projector output">
 <div id="map-touch" class="touch-overlay" aria-hidden="true"></div>
 <div id="map-hint" class="map-hint" hidden></div>
 <div id="mo-corner" class="mo-corner mo-ui"><button id="mo-x" class="tb-btn mo-x" type="button" aria-label="Exit output"><svg><use href="#i-close"/></svg><span>Exit</span></button><button id="mo-more" class="tb-btn mo-more" type="button" aria-label="Output controls"><svg><use href="#i-grid"/></svg></button></div>
 <div id="map-out-bar" class="map-out-bar mo-ui" hidden role="toolbar" aria-label="Output controls">
  <button id="mo-exit" class="tb-btn accent" type="button"><svg><use href="#i-close"/></svg><span>Exit output</span></button>
  <button id="mo-test" class="tb-btn" type="button" aria-pressed="false"><svg><use href="#i-grid"/></svg><span>Test pattern</span></button>
  <button id="mo-black" class="tb-btn" type="button" aria-pressed="false"><svg><use href="#i-power"/></svg><span>Blackout</span></button>
  <button id="mo-perform" class="tb-btn" type="button" aria-pressed="true"><svg><use href="#i-finger"/></svg><span>Fingers</span></button>
 </div>
</div>
<noscript><p class="noscript">Pixel Pusher needs JavaScript and WebGL.</p></noscript>
</body>
</html>
